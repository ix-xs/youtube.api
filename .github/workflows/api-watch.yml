name: API watch

# Once a week, compares the pinned discovery documents with what Google
# serves. The run fails when YouTube added, removed or changed something,
# which is the cue to run `npm run discovery:update`.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-discovery.mjs --check
