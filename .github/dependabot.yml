version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The types follow a Node.js version the package supports (see "engines").
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 has no compiler API for tsup to build the declarations with.
      - dependency-name: "typescript"
        versions: [">=7"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
